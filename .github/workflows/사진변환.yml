name: PNG 사진 JPG 변환
on:
  push:
    paths:
      - "data/images/img_005.png"
      - "data/images/img_007.png"
      - "tools/사진변환.py"
      - ".github/workflows/사진변환.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow
      - run: python tools/사진변환.py
      - name: 변환 이미지 및 메타데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/images data/metadata.csv
          if ! git diff --cached --quiet; then
            git commit -m "Convert numbered sample PNG files to JPEG"
            git push
          fi
